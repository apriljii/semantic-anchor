name: CI

on:
  push:
    branches: [main, ms]
  pull_request:
    branches: [main, ms]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Validate ConstraintUnit schema
        run: npm run validate:spec

      - name: Unit tests
        run: npm test

      - name: Crash-test demo regression
        run: npm run demo

      - name: Environment adapter demo
        run: node examples/adapters/tsc-demo.js

      - name: Derived constraints demo
        run: npm run demo:derived

      - name: Harness gate demo
        run: npm run demo:harness
