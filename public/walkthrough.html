    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    nav {
      position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); height: 56px;
    }
    .nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 24px; height: 100%;
      display: flex; align-items: center; justify-content: space-between; }
    .nav-brand { text-decoration: none; color: var(--anchor); font-weight: 700; font-size: 15px; }
    .nav-links { display: flex; gap: 20px; list-style: none; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
    .hero { margin-bottom: 32px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em;

    .lead { color: var(--text-secondary); max-width: 640px; margin-bottom: 20px; }
    .task-box {

      border-radius: 0 var(--radius) var(--radius) 0; padding: 16px 20px; font-size: 14px;
      color: var(--text-secondary); margin-bottom: 24px;
    }
    .case-tabs { display: flex; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .case-tab {
      flex: 1; min-width: 220px; background: #fff; border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px; cursor: pointer; text-align: left;
      font-family: var(--font); transition: all 0.15s;

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightJson(obj) {
  const raw = JSON.stringify(obj, null, 2);
  return raw.split('\n').map((line) => {
    let h = esc(line);
    h = h.replace(/^(\s*)"([^"\\]*(?:\\.[^"\\]*)*)"(\s*:)/,
      '$1<span class="jk">"$2"</span>$3');
    h = h.replace(/: "([^"\\]*(?:\\.[^"\\]*)*)"/,
      ': <span class="js">"$1"</span>');
    h = h.replace(/: (-?\d+(?:\.\d+)?)([,\s]*$)/,
      ': <span class="jn">$1</span>$2');
    h = h.replace(/: (true|false)([,\s]*$)/,
      ': <span class="jb">$1</span>$2');
    return h;
  }).join('\n');
}

function renderCodeLines(lines) {
  return lines.map(({ n, hl, text }) => {
    const ln = `<span class="ln">${String(n).padStart(2)}</span>`;
    const inner = `${ln}${esc(text)}`;
    if (hl === 'drift') return `<span class="hl-drift">${inner}</span>`;
    if (hl === 'violation') return `<span class="hl-violation">${inner}</span>`;
    if (hl === 'ok') return `<span class="hl-ok">${inner}</span>`;
    return inner;
  }).join('\n');
}

function codeBlock(file, badge, badgeClass, lines) {
  return `<div class="code-wrap">
    <div class="code-head"><span>${esc(file)}</span><span class="${badgeClass}">${esc(badge)}</span></div>
    <pre>${renderCodeLines(lines)}</pre>
  </div>`;
}

function jsonBlock(label, obj) {
  return `<div class="code-wrap">
    <div class="code-head"><span>${esc(label)}</span><span>JSON</span></div>
    <pre>${highlightJson(obj)}</pre>
  </div>`;
}

      stats: data.bindDeclared.stats,
      inject: data.bindDeclared.injection,
      bundle: data.bindDeclared.bundle,
    });
  }
  const derivedUnits = document.getElementById('derived-units');
  if (derivedUnits) derivedUnits.innerHTML = jsonBlock('deriveFromTypescript()', data.derivedUnits);
  const bindDerived = document.getElementById('bind-derived');
  if (bindDerived) {
    bindDerived.innerHTML = jsonBlock('bind_constraints (+ derived)', {
      stats: data.bindWithDerived.stats,
      inject: data.bindWithDerived.injection,
      bundle: data.bindWithDerived.bundle,
    });
  }
  const draftFb = document.getElementById('draft-feedback');
  if (draftFb && data.verify?.draft?.feedback) draftFb.textContent = data.verify.draft.feedback;
  const mNaive = document.getElementById('metric-naive');
  if (mNaive) mNaive.textContent = data.metrics.naiveErrors;
  const mFixed = document.getElementById('metric-fixed');
  if (mFixed) mFixed.textContent = data.metrics.fixedErrors;
  const badge = document.getElementById('live-badge');
  if (badge) badge.textContent = ' · live metrics from /api/walkthrough/' + data.caseId;
  document.querySelectorAll('.case-tab-metric').forEach((el, i) => {
    const id = Object.keys(CASES)[i];
    if (id === data.caseId) {
      el.innerHTML = `<span class="bad">${data.metrics.naiveErrors}</span> → <span class="good">${data.metrics.fixedErrors}</span>`;
    }
  });
}

async function fetchLive(caseId) {
  try {
    const res = await fetch('/api/walkthrough/' + caseId);
    if (!res.ok) return null;
    return await res.json();
  } catch {
    return null;
  }
}

function renderCaseTabs(active) {
  return Object.entries(CASES).map(([id, c]) => `
    <button class="case-tab${id === active ? ' active' : ''}" data-case="${id}" type="button">
      <div class="case-tab-label">${esc(c.label)}</div>
      <div class="case-tab-title">${esc(c.title.split('·')[1]?.trim() || c.title)}</div>
      <div class="case-tab-desc">${esc(c.lead.slice(0, 48))}…</div>
      <div class="case-tab-metric"><span class="bad">${c.naiveErrors}</span> → <span class="good">0</span></div>
    </button>`).join('');
}

let currentCase = new URLSearchParams(location.search).get('case') || 'quant';
if (!CASES[currentCase]) currentCase = 'quant';

let currentStep = new URLSearchParams(location.search).get('step') || '0';

function setCase(id, step) {
  currentCase = id;
  const c = CASES[id];
  document.getElementById('hero-title').textContent = c.title;
  document.getElementById('hero-lead').textContent = c.lead;
  document.getElementById('hero-task').innerHTML = `<strong>PM 任务：</strong>${esc(c.task.replace(/^PM 任务：/, ''))}`;
  document.getElementById('case-tabs').innerHTML = renderCaseTabs(id);
  document.getElementById('panels').innerHTML = renderPanels(c);
  setStep(step ?? currentStep);
  fetchLive(id).then((data) => applyLiveData(c, data));
  const url = new URL(location.href);
  url.searchParams.set('case', id);
  url.searchParams.set('step', currentStep);
  history.replaceState(null, '', url);
}

function setStep(id) {
  currentStep = String(id);
  document.querySelectorAll('.step-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.step === currentStep));
  document.querySelectorAll('.panel').forEach(p =>
    p.classList.toggle('active', p.dataset.panel === currentStep));
  const url = new URL(location.href);
  url.searchParams.set('step', currentStep);
  history.replaceState(null, '', url);
}

document.getElementById('case-tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.case-tab');
  if (!tab) return;
  setCase(tab.dataset.case, '0');
});

document.getElementById('steps').addEventListener('click', (e) => {
  const btn = e.target.closest('.step-btn');
  if (!btn) return;
  setStep(btn.dataset.step);
});

setCase(currentCase, currentStep);
</script>
</body>
</html>
